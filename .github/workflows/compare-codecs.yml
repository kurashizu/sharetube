name: compare-codecs

# Side-by-side encode comparison: libx264 on ubuntu-latest vs
# h264_videotoolbox on macos-14 (Apple Silicon). Both jobs run in
# parallel on the SAME source URL with the SAME output settings, so
# the only variable is the encoder.
#
# Manual trigger: gh workflow run compare-codecs.yml
# Watch:           gh run watch --exit-status

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "Source URL (default: 4K YouTube clip)"
        required: false
        default: "https://youtu.be/7yh64THGjCE"
      max_height:
        description: "Cap source resolution (default 720p)"
        required: false
        default: "720"
      video_bitrate:
        description: "Target video bitrate"
        required: false
        default: "600k"

jobs:
  libx264-linux:
    name: libx264 · ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install ffmpeg + yt-dlp + deno
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg curl
          ffmpeg -version | head -1
          # yt-dlp[default] pulls the EJS challenge solver script
          # bundle; deno is the JS runtime that runs it. YouTube
          # recently tightened n-challenge solving to require both.
          sudo curl -fsSL https://deno.land/install.sh | sudo DENO_INSTALL=/usr/local sh -s -- -y
          /usr/local/bin/deno --version
          sudo python3 -m pip install --break-system-packages --quiet 'yt-dlp[default]'
          python3 -m yt_dlp --version

      - name: Decrypt cookies (YouTube bot wall)
        if: hashFiles('secrets/cookies.txt.enc') != ''
        env:
          COOKIES_PASS: ${{ secrets.COOKIES_PASS }}
        run: |
          set -euo pipefail
          if [ -z "${COOKIES_PASS:-}" ]; then
            echo "::warning::COOKIES_PASS not set; downloads may hit bot wall"
            exit 0
          fi
          if [ ! -f secrets/cookies.txt.enc ]; then
            echo "::warning::secrets/cookies.txt.enc missing"
            exit 0
          fi
          mkdir -p /tmp/cookies
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -salt \
            -pass "env:COOKIES_PASS" \
            -in secrets/cookies.txt.enc \
            -out /tmp/cookies/cookies.txt
          chmod 600 /tmp/cookies/cookies.txt
          ls -lh /tmp/cookies/cookies.txt
          echo "cookies decrypted ($(wc -l < /tmp/cookies/cookies.txt) lines)"

      - name: Download source (capped)
        env:
          VIDEO_URL: ${{ inputs.video_url }}
          MAX_HEIGHT: ${{ inputs.max_height }}
        run: |
          set -euo pipefail
          COOKIE_ARGS=()
          if [ -f /tmp/cookies/cookies.txt ]; then
            COOKIE_ARGS=(--cookies /tmp/cookies/cookies.txt)
          fi
          yt-dlp --no-playlist --no-progress \
            "${COOKIE_ARGS[@]}" \
            -f "bv*[height<=${MAX_HEIGHT}]+ba/b[height<=${MAX_HEIGHT}]" \
            --merge-output-format mp4 \
            -o src.mp4 \
            "${VIDEO_URL}"
          ls -lh src.mp4
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,width,height,r_frame_rate -of default=nw=1 src.mp4

      - name: Encode (libx264 + watermark)
        env:
          VBITRATE: ${{ inputs.video_bitrate }}
        run: |
          set -euo pipefail
          START_NS=$(date +%s%N)
          ffmpeg -y -hide_banner \
            -i src.mp4 \
            -vf "drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='libx264 %{pts\\:hms}':fontsize=24:fontcolor=white:x=10:y=10:box=1:boxcolor=black@0.5:boxborderw=4" \
            -c:v libx264 -preset fast -b:v "${VBITRATE}" -maxrate "${VBITRATE}" -bufsize 1200k \
            -c:a aac -b:a 128k \
            -movflags +faststart \
            out_libx264.mp4 2>&1 | tee encode.log | tail -20
          END_NS=$(date +%s%N)
          WALL_MS=$(( (END_NS - START_NS) / 1000000 ))
          echo ""
          echo "==== RESULT (libx264) ===="
          echo "wall_time_ms=${WALL_MS}"
          echo "ffmpeg_speed=$(grep -oE 'speed= *[0-9.]+x' encode.log | tail -1 || echo 'n/a')"
          ls -lh out_libx264.mp4
          ffprobe -v error -show_entries format=duration,bit_rate,size -show_entries stream=codec_name,width,height -of default=nw=1 out_libx264.mp4

  videotoolbox-mac:
    name: h264_videotoolbox · macos-14
    runs-on: macos-14
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install ffmpeg with VideoToolbox + yt-dlp + deno
        run: |
          set -euo pipefail
          # GitHub macOS runner ships with Apple's stripped ffmpeg
          # (no h264_videotoolbox). Homebrew's ffmpeg has it enabled
          # by default; reinstall to make sure it's in front of the
          # system binary on PATH.
          brew install ffmpeg deno
          which ffmpeg
          ffmpeg -version | head -1
          ffmpeg -encoders 2>/dev/null | grep h264_videotoolbox || \
            (echo "FAIL: h264_videotoolbox still missing after brew install" && exit 1)
          which deno && deno --version
          # macOS system Python blocks pip (PEP 668); force-install
          # yt-dlp[default] into the user site-packages.
          python3 -m pip install --user --break-system-packages --quiet 'yt-dlp[default]'
          export PATH="$HOME/Library/Python/bin:$PATH"
          python3 -m yt_dlp --version

      - name: Decrypt cookies (YouTube bot wall)
        if: hashFiles('secrets/cookies.txt.enc') != ''
        env:
          COOKIES_PASS: ${{ secrets.COOKIES_PASS }}
        run: |
          set -euo pipefail
          if [ -z "${COOKIES_PASS:-}" ]; then
            echo "::warning::COOKIES_PASS not set; downloads may hit bot wall"
            exit 0
          fi
          if [ ! -f secrets/cookies.txt.enc ]; then
            echo "::warning::secrets/cookies.txt.enc missing"
            exit 0
          fi
          mkdir -p /tmp/cookies
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -salt \
            -pass "env:COOKIES_PASS" \
            -in secrets/cookies.txt.enc \
            -out /tmp/cookies/cookies.txt
          chmod 600 /tmp/cookies/cookies.txt
          ls -lh /tmp/cookies/cookies.txt
          echo "cookies decrypted ($(wc -l < /tmp/cookies/cookies.txt) lines)"

      - name: Download source (capped)
        env:
          VIDEO_URL: ${{ inputs.video_url }}
          MAX_HEIGHT: ${{ inputs.max_height }}
        run: |
          set -euo pipefail
          COOKIE_ARGS=()
          if [ -f /tmp/cookies/cookies.txt ]; then
            COOKIE_ARGS=(--cookies /tmp/cookies/cookies.txt)
          fi
          python3 -m yt_dlp --no-playlist --no-progress \
            "${COOKIE_ARGS[@]}" \
            -f "bv*[height<=${MAX_HEIGHT}]+ba/b[height<=${MAX_HEIGHT}]" \
            --merge-output-format mp4 \
            -o src.mp4 \
            "${VIDEO_URL}"
          ls -lh src.mp4
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,width,height,r_frame_rate -of default=nw=1 src.mp4

      - name: Encode (h264_videotoolbox)
        env:
          VBITRATE: ${{ inputs.video_bitrate }}
        run: |
          set -euo pipefail
          # No drawtext: Homebrew's ffmpeg doesn't ship libfreetype by
          # default (the ffmpeg-full formula does), so the drawtext
          # filter isn't available here. Pure encode comparison anyway.
          START_NS=$(date +%s%N)
          ffmpeg -y -hide_banner \
            -i src.mp4 \
            -c:v h264_videotoolbox -b:v "${VBITRATE}" -realtime 1 -allow_sw 1 \
            -c:a aac -b:a 128k \
            -movflags +faststart \
            out_videotoolbox.mp4 2>&1 | tee encode.log | tail -20
          END_NS=$(date +%s%N)
          WALL_MS=$(( (END_NS - START_NS) / 1000000 ))
          echo ""
          echo "==== RESULT (h264_videotoolbox) ===="
          echo "wall_time_ms=${WALL_MS}"
          echo "ffmpeg_speed=$(grep -oE 'speed= *[0-9.]+x' encode.log | tail -1 || echo 'n/a')"
          ls -lh out_videotoolbox.mp4
          ffprobe -v error -show_entries format=duration,bit_rate,size -show_entries stream=codec_name,width,height -of default=nw=1 out_videotoolbox.mp4

      - name: Upload artifact (Mac encoded file)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: videotoolbox-out
          path: out_videotoolbox.mp4
          if-no-files-found: ignore