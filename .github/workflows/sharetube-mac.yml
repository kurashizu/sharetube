name: sharetube-mac

# Apple Silicon runner that uses VideoToolbox H.264 hardware encoding
# instead of libx264. Triggered by the same `repository_dispatch`
# `sharetube-job` event as sharetube.yml, but ONLY when
# `client_payload.runner == 'mac'` — the Worker picks the runner
# target based on the user's setting. Default (no `runner` field,
# or `runner == 'linux'`) goes to the Linux workflow instead.
#
# Also accepts workflow_dispatch so this can be exercised manually
# for end-to-end testing without going through the Worker.
#
# Tooling differs from sharetube.yml because the macOS runner image
# uses a pinned Apple Silicon static FFmpeg build with VideoToolbox,
# yt-dlp as the universal Python zipapp, deno as the aarch64-apple-darwin
# zip, omni-client as the macOS tarball, and fonts from the
# notofonts/noto-cjk GitHub mirror. No package manager is used at runtime.

on:
  repository_dispatch:
    types: [sharetube-job]
  workflow_dispatch:
    inputs:
      job_id:
        description: "Job ID (must be a UUID; any value works for smoke tests)"
        required: true
        default: "00000000-0000-0000-0000-000000000000"
      url:
        description: "Source URL (manual runs)"
        required: true
        default: "https://youtu.be/7yh64THGjCE"
      config_json:
        description: "Per-job config JSON (manual runs)"
        required: true
        default: '{"max_resolution":"720p","output_resolution":"720p","video_bitrate":"600k","audio_bitrate":"128k","ttl_seconds":3600,"watermark_enabled":true,"watermark_line1":"sharetube.krsz.in","watermark_line2":"{title} · {resolution} · {duration}","watermark_font_size":28,"encoder_preset":"fast","use_cookies":true}'

# Skip when the dispatch payload isn't aimed at the Mac runner. The
# default (no `runner` key) and `runner == 'linux'` go to sharetube.yml.
concurrency:
  group: sharetube-mac-${{ github.event.client_payload.job_id || inputs.job_id }}
  cancel-in-progress: false

jobs:
  run:
    # Mac worker. Fires when dispatched with `runner: mac`, or via
    # workflow_dispatch (manual smoke tests). Default Linux jobs go
    # to sharetube.yml instead.
    if: github.event_name == 'workflow_dispatch' || github.event.client_payload.runner == 'mac'
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # ── Tool versions & cache ─────────────────────────────────
      # Only yt-dlp is version-checked at run time (it has clean
      # numbered tags and updates often). Everything else — pinned static
      # ffmpeg, deno, omni-client, and CJK fonts — is frozen and lives
      # under a stable cache key, so cached runs skip the downloads entirely.
      #
      # Mirror of the same pattern used in sharetube.yml.

      - name: Resolve yt-dlp version
        id: yt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          YT_DLP_VER=$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            https://api.github.com/repos/yt-dlp/yt-dlp/releases/latest \
            | python3 -c "import json,sys;print(json.load(sys.stdin)['tag_name'])")
          echo "v=${YT_DLP_VER}" >> "$GITHUB_OUTPUT"

      # yt-dlp alone — new version = new key, restore-keys falls back
      # to the previous release so we can update the binary in place.
      - name: Cache yt-dlp
        id: ytdlp
        uses: actions/cache@v6
        with:
          path: ~/.local/tools/yt-dlp
          key: ytdlp-mac-${{ steps.yt.outputs.v }}
          restore-keys: |
            ytdlp-mac-

      # All fixed tools are ordinary user-owned files. The FFmpeg archive
      # is static and contains no external dylib paths, so it is safe to
      # restore directly on every ephemeral macOS runner.
      - name: Cache frozen tools
        id: fixed
        uses: actions/cache@v6
        with:
          path: |
            ~/.local/tools/ffmpeg
            ~/.local/tools/ffprobe
            ~/.local/tools/deno
            ~/.local/tools/wgcf
            ~/.local/tools/wg
            ~/.local/tools/wg-quick
            ~/.local/tools/wireguard-go
            ~/.local/tools/omni-client
            ~/.local/share/fonts
          key: macos26-fixed-deno${{ vars.DENO_VER }}-omni-${{ vars.OMNIPROXY_VER }}-ffmpeg-arm64-8.1-warp-v2.2.32-wg-1

      - name: Install yt-dlp
        run: |
          set -euo pipefail
          mkdir -p ~/.local/tools
          # Refresh unless the restored binary already matches the
          # latest release (restore-keys may fall back to an older one).
          CURRENT=$(~/.local/tools/yt-dlp --version 2>/dev/null || true)
          echo "cached yt-dlp: ${CURRENT:-<none>}, latest: ${{ steps.yt.outputs.v }}"
          if [ -x ~/.local/tools/yt-dlp ] && [ "${CURRENT}" = "${{ steps.yt.outputs.v }}" ]; then
            echo "yt-dlp already up to date; skipping download"
            exit 0
          fi
          curl -fsSL --max-time 120 --retry 2 -o ~/.local/tools/yt-dlp \
            "https://github.com/yt-dlp/yt-dlp/releases/download/${{ steps.yt.outputs.v }}/yt-dlp_macos"
          chmod +x ~/.local/tools/yt-dlp
          ~/.local/tools/yt-dlp --version

      - name: Install frozen tools (direct binaries)
        run: |
          set -euo pipefail
          mkdir -p ~/.local/tools ~/.local/share/fonts

          # Pinned static Apple Silicon build. The archive is verified before
          # extraction; it has no dynamic-library dependency.
          FFMPEG_URL="https://github.com/kiimelon/FFmpeg-arm-silicon/releases/download/0.5.0/FFmpeg-arm-silicon-Tools-20260424.zip"
          FFMPEG_SHA256="7262b3ff400c0e88235647d99ab79067010694f059c4aa8af0bb0c43a951b2fc"
          if [ ! -x ~/.local/tools/ffmpeg ] || [ ! -x ~/.local/tools/ffprobe ]; then
            curl -fsSL --max-time 300 --retry 2 -o /tmp/ffmpeg-tools.zip "$FFMPEG_URL"
            echo "$FFMPEG_SHA256  /tmp/ffmpeg-tools.zip" | shasum -a 256 -c -
            rm -rf /tmp/ffmpeg-tools
            mkdir -p /tmp/ffmpeg-tools
            ditto -x -k /tmp/ffmpeg-tools.zip /tmp/ffmpeg-tools
            install -m 755 /tmp/ffmpeg-tools/Tools/ffmpeg ~/.local/tools/ffmpeg
            install -m 755 /tmp/ffmpeg-tools/Tools/ffprobe ~/.local/tools/ffprobe
            rm -rf /tmp/ffmpeg-tools /tmp/ffmpeg-tools.zip
          fi

          # Deno's official Apple Silicon archive, pinned by DENO_VER.
          DENO_ZIP="/tmp/deno-aarch64-apple-darwin.zip"
          if [ ! -x ~/.local/tools/deno ]; then
            curl -fsSL --max-time 120 --retry 2 -o "$DENO_ZIP" \
              "https://github.com/denoland/deno/releases/download/${{ vars.DENO_VER }}/deno-aarch64-apple-darwin.zip"
            DENO_SUM=$(curl -fsSL --max-time 60 --retry 2 \
              "https://github.com/denoland/deno/releases/download/${{ vars.DENO_VER }}/deno-aarch64-apple-darwin.zip.sha256sum" \
              | awk '{print $1}')
            echo "$DENO_SUM  $DENO_ZIP" | shasum -a 256 -c -
            rm -rf /tmp/deno-tools
            mkdir -p /tmp/deno-tools
            ditto -x -k "$DENO_ZIP" /tmp/deno-tools
            install -m 755 /tmp/deno-tools/deno ~/.local/tools/deno
            rm -rf /tmp/deno-tools "$DENO_ZIP"
          fi

          # wgcf: Cloudflare WARP account/profile generator. The account
          # file is decrypted only in the tunnel step below.
          if [ ! -x ~/.local/tools/wgcf ]; then
            curl -fsSL --max-time 120 --retry 2 -o ~/.local/tools/wgcf \
              "https://github.com/ViRb3/wgcf/releases/download/v2.2.32/wgcf_2.2.32_darwin_arm64"
            echo "6c19e27eefade597f3778f5fdcbd0a5f5297e9ff343cbb44cc206e21d83d48fb  ~/.local/tools/wgcf" | shasum -a 256 -c -
            chmod +x ~/.local/tools/wgcf
          fi

          # WireGuard userspace tools, built from pinned upstream sources.
          if [ ! -x ~/.local/tools/wg ] || [ ! -x ~/.local/tools/wg-quick ] || [ ! -x ~/.local/tools/wireguard-go ]; then
            curl -fsSL --max-time 120 --retry 2 -o /tmp/go.tar.gz \
              "https://go.dev/dl/go1.26.5.darwin-arm64.tar.gz"
            echo "efb87ff28af9a188d0536ef5d42e63dd52ba8263cd7344a993cc48dd11dedb6a  /tmp/go.tar.gz" | shasum -a 256 -c -
            rm -rf /tmp/go
            tar xzf /tmp/go.tar.gz -C /tmp
            export PATH="/tmp/go/bin:$PATH"
            curl -fsSL --max-time 120 --retry 2 -o /tmp/wireguard-tools.tar.xz \
              "https://git.zx2c4.com/wireguard-tools/snapshot/wireguard-tools-1.0.20260223.tar.xz"
            echo "af459827b80bfd31b83b08077f4b5843acb7d18ad9a33a2ef532d3090f291fbf  /tmp/wireguard-tools.tar.xz" | shasum -a 256 -c -
            curl -fsSL --max-time 120 --retry 2 -o /tmp/wireguard-go.tar.xz \
              "https://git.zx2c4.com/wireguard-go/snapshot/wireguard-go-0.0.20250522.tar.xz"
            echo "c7eeffb13e5eb43b93e54a21d78dd71414771af9e07112da5275690493695c9c  /tmp/wireguard-go.tar.xz" | shasum -a 256 -c -
            rm -rf /tmp/wireguard-tools-1.0.20260223 /tmp/wireguard-go-0.0.20250522
            tar xJf /tmp/wireguard-tools.tar.xz -C /tmp
            tar xJf /tmp/wireguard-go.tar.xz -C /tmp
            make -C /tmp/wireguard-tools-1.0.20260223/src -j2
            make -C /tmp/wireguard-go-0.0.20250522 -j2
            install -m 755 /tmp/wireguard-tools-1.0.20260223/src/wg ~/.local/tools/wg
            install -m 755 /tmp/wireguard-tools-1.0.20260223/src/wg-quick/darwin.bash ~/.local/tools/wg-quick
            install -m 755 /tmp/wireguard-go-0.0.20250522/wireguard-go ~/.local/tools/wireguard-go
            rm -rf /tmp/go /tmp/go.tar.gz /tmp/wireguard-tools-1.0.20260223 /tmp/wireguard-go-0.0.20250522 /tmp/wireguard-tools.tar.xz /tmp/wireguard-go.tar.xz
          fi

          # OmniProxy client and font are ordinary cached files. Only
          # fetch them when the cache did not restore them.
          if [ ! -x ~/.local/tools/omni-client ]; then
            curl -fsSL --max-time 120 --retry 2 -o /tmp/omni.tar.xz \
              "https://github.com/kurashizu/OmniProxy/releases/download/${{ vars.OMNIPROXY_VER }}/omni-proxy-macos-aarch64.tar.xz"
            tar xJf /tmp/omni.tar.xz -C /tmp
            mv /tmp/dist/client ~/.local/tools/omni-client
            chmod +x ~/.local/tools/omni-client
            rm -f /tmp/omni.tar.xz
          fi

          if [ ! -f ~/.local/share/fonts/NotoSansCJK-Regular.ttc ]; then
            curl -fsSL --max-time 120 --retry 2 -o ~/.local/share/fonts/NotoSansCJK-Regular.ttc \
              "https://github.com/notofonts/noto-cjk/raw/main/Sans/OTC/NotoSansCJK-Regular.ttc"
          fi

      - name: Validate frozen tools
        run: |
          set -euo pipefail
          ~/.local/tools/ffmpeg -version | head -1
          ~/.local/tools/ffmpeg -encoders | grep h264_videotoolbox
          ~/.local/tools/ffmpeg -filters | grep drawtext
          ~/.local/tools/deno --version | head -1
          ~/.local/tools/omni-client --version
          ls -lh ~/.local/tools/ffmpeg ~/.local/tools/ffprobe ~/.local/tools/deno ~/.local/tools/omni-client ~/.local/share/fonts/NotoSansCJK-Regular.ttc

      - name: Add tools to PATH
        run: echo "$HOME/.local/tools" >> "$GITHUB_PATH"

      # yt-dlp[default] provides the EJS challenge solver scripts that the
      # standalone zipapp imports on demand. The set of packages and
      # their pinned versions change rarely, so we cache the user-site
      # and only reinstall if the marker is stale.
      - name: Cache yt-dlp Python deps
        id: pypkgs
        uses: actions/cache@v6
        with:
          path: |
            ~/.local/lib/python3.13/site-packages/yt_dlp
            ~/.local/lib/python3.13/site-packages/yt_dlp-*.dist-info
            ~/.local/lib/python3.13/site-packages/brotli
            ~/.local/lib/python3.13/site-packages/brotlicffi
            ~/.local/lib/python3.13/site-packages/certifi
            ~/.local/lib/python3.13/site-packages/mutagen
            ~/.local/lib/python3.13/site-packages/pycryptodomex
            ~/.local/lib/python3.13/site-packages/requests
            ~/.local/lib/python3.13/site-packages/urllib3
            ~/.local/lib/python3.13/site-packages/websockets
          key: macos26-yt-dlp-pydeps-1

      - name: Install yt-dlp Python deps
        if: steps.pypkgs.outputs.cache-hit != 'true'
        run: python3 -m pip install --user --break-system-packages --quiet 'yt-dlp[default]'

      # ── Cookies decryption ─────────────────────────────────────────

      - name: Decrypt cookies.txt
        env:
          COOKIES_PASS: ${{ secrets.COOKIES_PASS }}
        run: |
          set -euo pipefail
          if [ -z "${COOKIES_PASS:-}" ]; then
            echo "::warning::COOKIES_PASS secret empty; runner will skip --cookies"
            exit 0
          fi
          if [ ! -f secrets/cookies.txt.enc ]; then
            echo "::warning::secrets/cookies.txt.enc missing; runner will skip --cookies"
            exit 0
          fi
          mkdir -p ~/.local/share/sharetube
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in secrets/cookies.txt.enc \
            -out ~/.local/share/sharetube/cookies.txt \
            -pass env:COOKIES_PASS
          # never log cookie contents — public repo, public Actions log
          ls -la ~/.local/share/sharetube/cookies.txt

      # ── Tunnel ──────────────────────────────────────────────────────
      # The selected mode controls the route before yt-dlp starts:
      # Oracle Australia uses the existing SOCKS5 tunnel; WARP uses the
      # encrypted wgcf account and a full WireGuard tunnel; disabled uses
      # the runner's normal network.
      - name: Start proxy tunnel
        env:
          OMNIPROXY_SERVER: ${{ vars.OMNIPROXY_SERVER }}
          PROXY_TOKEN: ${{ secrets.PROXY_TOKEN }}
          COOKIES_PASS: ${{ secrets.COOKIES_PASS }}
          JOB_CONFIG_JSON: ${{ github.event.client_payload.config || inputs.config_json }}
        run: |
          set -euo pipefail
          PROXY_MODE=$(python3 -c 'import json,os; d=json.loads(os.environ.get("JOB_CONFIG_JSON") or "{}"); m=d.get("proxy_mode"); print(m if m in {"oracle-australia","cloudflare-warp","disabled"} else ("oracle-australia" if d.get("use_proxy", True) else "disabled"))')
          if [ "$PROXY_MODE" = "cloudflare-warp" ]; then
            command -v wg-quick >/dev/null || { echo "::error::wireguard-tools missing"; exit 1; }
            command -v wg >/dev/null || { echo "::error::wg missing"; exit 1; }
            [ -x ~/.local/tools/wireguard-go ] || { echo "::error::wireguard-go missing"; exit 1; }
            [ -f secrets/wgcf-account.toml.enc ] || { echo "::error::encrypted WARP account missing"; exit 1; }
            export WG_QUICK_USERSPACE_IMPLEMENTATION="$HOME/.local/tools/wireguard-go"
            mkdir -p "$RUNNER_TEMP/sharetube-warp"
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
              -in secrets/wgcf-account.toml.enc \
              -out "$RUNNER_TEMP/sharetube-warp/wgcf-account.toml" \
              -pass env:COOKIES_PASS
            ~/.local/tools/wgcf generate \
              --config "$RUNNER_TEMP/sharetube-warp/wgcf-account.toml" \
              --profile "$RUNNER_TEMP/sharetube-warp/wgcf.conf"
            sudo env "PATH=$HOME/.local/tools:$PATH" wg-quick up "$RUNNER_TEMP/sharetube-warp/wgcf.conf"
            if WARP_IP=$(curl -fsSL --max-time 20 https://api.ipify.org); then
              echo "Cloudflare WARP tunnel up, exit IP: $WARP_IP"
            else
              echo "::error::Cloudflare WARP tunnel did not provide network access"
              exit 1
            fi
            exit 0
          fi
          if [ "$PROXY_MODE" = "disabled" ]; then
            echo "proxy disabled by job settings"
            exit 0
          fi
          if [ -z "${OMNIPROXY_SERVER:-}" ] || [ -z "${PROXY_TOKEN:-}" ]; then
            echo "::warning::OMNIPROXY_SERVER/PROXY_TOKEN not set; running without tunnel"
            exit 0
          fi
          cat > /tmp/omniproxy.yml <<EOF
          addr: 127.0.0.1
          port: 1080
          token: "${PROXY_TOKEN}"
          server: "wss://${OMNIPROXY_SERVER}"
          EOF
          nohup ~/.local/tools/omni-client --config /tmp/omniproxy.yml \
            > /tmp/omniproxy.log 2>&1 &
          for i in $(seq 1 30); do
            if IP=$(curl -s --socks5-hostname 127.0.0.1:1080 https://api.ipify.org 2>/dev/null); then
              echo "tunnel up, exit IP: ${IP}"
              echo "PROXY_URL=socks5://127.0.0.1:1080" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 1
          done
          echo "::error::OmniProxy tunnel failed to come up"
          cat /tmp/omniproxy.log
          exit 1

      # ── Run ────────────────────────────────────────────────────────
      - name: Resolve job id (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch'
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
          INTERNAL_TOKEN: ${{ secrets.INTERNAL_TOKEN }}
          URL: ${{ inputs.url }}
          CONFIG_JSON: ${{ inputs.config_json }}
        run: |
          set -euo pipefail
          # When invoked via repository_dispatch the Worker already
          # created the D1 row; for manual workflow_dispatch tests we
          # POST /api/jobs ourselves so the runner has a real job_id
          # and its progress updates land in the backend instead of
          # being silently dropped as 404s. We also stamp
          # runner=mac into the config so the Worker's dispatch
          # payload carries the right tag — otherwise sharetube.yml
          # sees no runner field, defaults to linux, and races us.
          STAMPED=$(python3 -c "
          import json, sys
          cfg = json.loads('''${CONFIG_JSON}''')
          cfg['runner'] = 'mac'
          print(json.dumps(cfg))
          ")
          RESP=$(curl -sS -X POST "${WORKER_URL}/api/jobs" \
            -H 'Content-Type: application/json' \
            -d "{\"url\":\"${URL}\",\"config\":${STAMPED}}")
          echo "create response: $RESP"
          JOB_ID=$(echo "$RESP" | python3 -c "import json,sys; print(json.load(sys.stdin)['id'])")
          echo "JOB_ID=${JOB_ID}"
          echo "JOB_ID=${JOB_ID}" >> "$GITHUB_ENV"

      - name: Run sharetube runner
        env:
          JOB_ID: ${{ github.event.client_payload.job_id || env.JOB_ID }}
          JOB_URL: ${{ github.event.client_payload.url || inputs.url }}
          JOB_CONFIG_JSON: ${{ github.event.client_payload.config || inputs.config_json }}
          BACKEND_URL: ${{ vars.WORKER_URL }}
          INTERNAL_TOKEN: ${{ secrets.INTERNAL_TOKEN }}
          COOKIES_PASS: ${{ secrets.COOKIES_PASS }}
        run: |
          set -euo pipefail
          echo "JOB_ID=$JOB_ID"
          echo "JOB_URL=$JOB_URL"
          echo "BACKEND_URL=$BACKEND_URL"
          echo "PROXY_URL=${PROXY_URL:-<none>}"
          [ -n "$JOB_ID" ] && [ -n "$JOB_URL" ] || { echo "missing JOB_ID or JOB_URL"; exit 1; }
          python -m runner

      - name: Cleanup (kill tunnel + wipe secrets)
        if: always()
        run: |
          if [ -f "${RUNNER_TEMP:-/tmp}/sharetube-warp/wgcf.conf" ]; then
            sudo env "PATH=$HOME/.local/tools:$PATH" WG_QUICK_USERSPACE_IMPLEMENTATION="$HOME/.local/tools/wireguard-go" wg-quick down "${RUNNER_TEMP:-/tmp}/sharetube-warp/wgcf.conf" || true
          fi
          pkill -f 'omni-client' || true
          pkill -f 'wireguard-go' || true
          rm -rf "${RUNNER_TEMP:-/tmp}/sharetube-warp"
          rm -f ~/.local/share/sharetube/cookies.txt