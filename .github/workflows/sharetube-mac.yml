name: sharetube-mac

# Apple Silicon runner that uses VideoToolbox H.264 hardware encoding
# instead of libx264. Triggered by the same `repository_dispatch`
# `sharetube-job` event as sharetube.yml, but ONLY when
# `client_payload.runner == 'mac'` — the Worker picks the runner
# target based on the user's setting. Default (no `runner` field,
# or `runner == 'linux'`) goes to the Linux workflow instead.
#
# Also accepts workflow_dispatch so this can be exercised manually
# for end-to-end testing without going through the Worker.
#
# Tooling differs from sharetube.yml because the macOS runner image
# doesn't ship our frozen Linux binaries: ffmpeg comes from brew
# (homebrew builds it with `--enable-videotoolbox`), yt-dlp as the
# universal Python zipapp, deno as the aarch64-apple-darwin zip,
# omni-client as the macOS tarball, fonts as NotoSansCJK-Regular.ttc
# pulled from the notofonts/noto-cjk GitHub mirror.

on:
  repository_dispatch:
    types: [sharetube-job]
  workflow_dispatch:
    inputs:
      job_id:
        description: "Job ID (must be a UUID; any value works for smoke tests)"
        required: true
        default: "00000000-0000-0000-0000-000000000000"
      url:
        description: "Source URL (manual runs)"
        required: true
        default: "https://youtu.be/7yh64THGjCE"
      config_json:
        description: "Per-job config JSON (manual runs)"
        required: true
        default: '{"max_resolution":"720p","output_resolution":"720p","video_bitrate":"600k","audio_bitrate":"128k","ttl_seconds":3600,"watermark_enabled":true,"watermark_line1":"sharetube.krsz.in","watermark_line2":"{title} · {resolution} · {duration}","watermark_font_size":28,"encoder_preset":"fast","use_cookies":true}'

# Skip when the dispatch payload isn't aimed at the Mac runner. The
# default (no `runner` key) and `runner == 'linux'` go to sharetube.yml.
concurrency:
  group: sharetube-mac-${{ github.event.client_payload.job_id || inputs.job_id }}
  cancel-in-progress: false

jobs:
  run:
    # Mac worker. Fires when dispatched with `runner: mac`, or via
    # workflow_dispatch (manual smoke tests). Default Linux jobs go
    # to sharetube.yml instead.
    if: github.event_name == 'workflow_dispatch' || github.event.client_payload.runner == 'mac'
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # ── Tool versions & cache ─────────────────────────────────
      # Only yt-dlp is version-checked at run time (it has clean
      # numbered tags and updates often). Everything else — ffmpeg
      # (ffmpeg-full bottle), deno, omni-client, CJK fonts, brew
      # bottles — is effectively frozen and lives under a stable cache
      # key, so cached runs skip the downloads entirely.
      #
      # Mirror of the same pattern used in sharetube.yml.

      - name: Resolve yt-dlp version
        id: yt
        env:
          # GH unauthenticated API is rate-limited to 60 req/h/IP and the
          # public Actions runners share IPs across many users — we've
          # already hit 403s. The auto-provided GITHUB_TOKEN bumps the
          # limit to 1000/h per repo, which is plenty.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          YT_DLP_VER=$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            https://api.github.com/repos/yt-dlp/yt-dlp/releases/latest \
            | python3 -c "import json,sys;print(json.load(sys.stdin)['tag_name'])")
          echo "v=${YT_DLP_VER}" >> "$GITHUB_OUTPUT"

      - name: Install deno (brew)
        # Mac brew install deno isn't part of the frozen-tools cache
        # because deno lives in /opt/homebrew and our cache key can't
        # reach across the cellar cheaply. The bottle itself is small
        # (~60 MB) and brew has its own bottle cache, so this is the
        # irreducible cost — but warm runs reuse the bottle and only
        # do the symlink, finishing in ~1 s.
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_ANALYTICS: '1'
        run: brew install deno

      # yt-dlp alone — new version = new key, restore-keys falls back
      # to the previous release so we can update the binary in place.
      - name: Cache yt-dlp
        id: ytdlp
        uses: actions/cache@v6
        with:
          path: ~/.local/tools/yt-dlp
          key: ytdlp-mac-${{ steps.yt.outputs.v }}
          restore-keys: |
            ytdlp-mac-

      # Everything else (portable ffmpeg bundle + omni-client + fonts) —
      # frozen; bump the -6 suffix manually when refreshing them.
      # Never cache the Homebrew Cellar: it includes every dependency
      # and image-installed formula, which grew to ~2 GB. The bundle
      # below contains only ffmpeg/ffprobe and their actual dylib closure.
      # The frozen cache never contains yt-dlp — that has its own
      # version-checked cache above.
      - name: Cache frozen tools
        id: fixed
        uses: actions/cache@v6
        with:
          path: |
            ~/.local/tools/ffmpeg-bundle
            ~/.local/tools/omni-client
            ~/.local/share/fonts
          key: macos26-fixed-denov${{ vars.DENO_VER }}-omni-${{ vars.OMNIPROXY_VER }}-ffmpeg-bundle-1

      - name: Install yt-dlp
        run: |
          set -euo pipefail
          mkdir -p ~/.local/tools
          # Refresh unless the restored binary already matches the
          # latest release (restore-keys may fall back to an older one).
          CURRENT=$(~/.local/tools/yt-dlp --version 2>/dev/null || true)
          echo "cached yt-dlp: ${CURRENT:-<none>}, latest: ${{ steps.yt.outputs.v }}"
          if [ -x ~/.local/tools/yt-dlp ] && [ "${CURRENT}" = "${{ steps.yt.outputs.v }}" ]; then
            echo "yt-dlp already up to date; skipping download"
            exit 0
          fi
          curl -fsSL --max-time 120 --retry 2 -o ~/.local/tools/yt-dlp \
            "https://github.com/yt-dlp/yt-dlp/releases/download/${{ steps.yt.outputs.v }}/yt-dlp_macos"
          chmod +x ~/.local/tools/yt-dlp
          ~/.local/tools/yt-dlp --version

      # ffmpeg-full + omni-client + font. Skipped on warm cache.
      # Homebrew is used only on a cache miss. Its ffmpeg-full formula
      # is dynamically linked to many Homebrew libraries, so build a
      # small self-contained bundle once instead of caching the entire
      # Cellar.
      - name: Install frozen tools (brew)
        if: steps.fixed.outputs.cache-hit != 'true'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_ANALYTICS: '1'
        run: |
          set -euo pipefail
          mkdir -p ~/.local/tools ~/.local/share/fonts
          brew install ffmpeg-full

          BUNDLE="$HOME/.local/tools/ffmpeg-bundle"
          rm -rf "$BUNDLE"
          mkdir -p "$BUNDLE/bin" "$BUNDLE/lib"
          cp -L "$(brew --prefix ffmpeg-full)/bin/ffmpeg" "$BUNDLE/bin/ffmpeg"
          cp -L "$(brew --prefix ffmpeg-full)/bin/ffprobe" "$BUNDLE/bin/ffprobe"

          # Collect only the Homebrew dylibs reachable from ffmpeg and
          # ffprobe. Every collected dependency is rewritten to load
          # from the bundle's lib directory. System frameworks remain
          # untouched. This avoids shipping the other ~2 GB of Cellar.
          queue=("$BUNDLE/bin/ffmpeg" "$BUNDLE/bin/ffprobe")
          seen="$BUNDLE/.seen"
          : > "$seen"
          while [ "${#queue[@]}" -gt 0 ]; do
            file="${queue[0]}"
            queue=("${queue[@]:1}")
            [ -f "$file" ] || continue
            while read -r dep; do
              case "$dep" in
                /opt/homebrew/*|@rpath/*)
                  name=$(basename "$dep")
                  real=""
                  if [[ "$dep" == /opt/homebrew/* ]]; then
                    real=$(realpath "$dep" 2>/dev/null || true)
                  else
                    real=$(find /opt/homebrew/opt -type f -name "$name" -print -quit 2>/dev/null || true)
                  fi
                  [ -n "$real" ] && [ -f "$real" ] || continue
                  target="$BUNDLE/lib/$name"
                  if ! grep -Fxq "$real" "$seen"; then
                    echo "$real" >> "$seen"
                    cp -L "$real" "$target"
                    queue+=("$target")
                  fi
                  install_name_tool -change "$dep" "@loader_path/../lib/$name" "$file"
                  ;;
              esac
            done < <(otool -L "$file" | tail -n +2 | awk '{print $1}')
          done
          rm -f "$seen"

          test -x "$BUNDLE/bin/ffmpeg"
          test -x "$BUNDLE/bin/ffprobe"
          "$BUNDLE/bin/ffmpeg" -encoders | grep h264_videotoolbox
          "$BUNDLE/bin/ffmpeg" -filters | grep drawtext

          # OmniProxy client: local SOCKS5 → WebSocket → Oracle exit IP.
          curl -fsSL --max-time 120 --retry 2 -o /tmp/omni.tar.xz \
            "https://github.com/kurashizu/OmniProxy/releases/download/${{ vars.OMNIPROXY_VER }}/omni-proxy-macos-aarch64.tar.xz"
          tar xJf /tmp/omni.tar.xz -C /tmp
          mv /tmp/dist/client ~/.local/tools/omni-client
          chmod +x ~/.local/tools/omni-client
          rm -f /tmp/omni.tar.xz

          # NotoSansCJK-Regular.ttc from the notofonts/noto-cjk mirror.
          curl -fsSL --max-time 120 --retry 2 -o ~/.local/share/fonts/NotoSansCJK-Regular.ttc \
            "https://github.com/notofonts/noto-cjk/raw/main/Sans/OTC/NotoSansCJK-Regular.ttc"

      # Always link and validate the restored portable bundle.
      - name: Link frozen tools into PATH
        run: |
          set -euo pipefail
          mkdir -p ~/.local/tools ~/.local/share/fonts
          ln -sf ~/.local/tools/ffmpeg-bundle/bin/ffmpeg ~/.local/tools/ffmpeg
          ln -sf ~/.local/tools/ffmpeg-bundle/bin/ffprobe ~/.local/tools/ffprobe
          test -x ~/.local/tools/ffmpeg
          test -x ~/.local/tools/ffprobe
          ~/.local/tools/ffmpeg -encoders | grep h264_videotoolbox
          ~/.local/tools/ffmpeg -filters | grep drawtext
          ls -lh ~/.local/tools/ffmpeg ~/.local/tools/ffprobe ~/.local/tools/omni-client ~/.local/share/fonts/NotoSansCJK-Regular.ttc

      - name: Add tools to PATH
        run: echo "$HOME/.local/tools" >> "$GITHUB_PATH"

      # yt-dlp[default] provides the EJS challenge solver scripts that the
      # standalone zipapp imports on demand. The set of packages and
      # their pinned versions change rarely, so we cache the user-site
      # and only reinstall if the marker is stale.
      - name: Cache yt-dlp Python deps
        id: pypkgs
        uses: actions/cache@v6
        with:
          path: |
            ~/.local/lib/python3.13/site-packages/yt_dlp
            ~/.local/lib/python3.13/site-packages/yt_dlp-*.dist-info
            ~/.local/lib/python3.13/site-packages/brotli
            ~/.local/lib/python3.13/site-packages/brotlicffi
            ~/.local/lib/python3.13/site-packages/certifi
            ~/.local/lib/python3.13/site-packages/mutagen
            ~/.local/lib/python3.13/site-packages/pycryptodomex
            ~/.local/lib/python3.13/site-packages/requests
            ~/.local/lib/python3.13/site-packages/urllib3
            ~/.local/lib/python3.13/site-packages/websockets
          key: macos26-yt-dlp-pydeps-1

      - name: Install yt-dlp Python deps
        if: steps.pypkgs.outputs.cache-hit != 'true'
        run: python3 -m pip install --user --break-system-packages --quiet 'yt-dlp[default]'

      # ── Cookies decryption ─────────────────────────────────────────

      - name: Decrypt cookies.txt
        env:
          COOKIES_PASS: ${{ secrets.COOKIES_PASS }}
        run: |
          set -euo pipefail
          if [ -z "${COOKIES_PASS:-}" ]; then
            echo "::warning::COOKIES_PASS secret empty; runner will skip --cookies"
            exit 0
          fi
          if [ ! -f secrets/cookies.txt.enc ]; then
            echo "::warning::secrets/cookies.txt.enc missing; runner will skip --cookies"
            exit 0
          fi
          mkdir -p ~/.local/share/sharetube
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in secrets/cookies.txt.enc \
            -out ~/.local/share/sharetube/cookies.txt \
            -pass env:COOKIES_PASS
          # never log cookie contents — public repo, public Actions log
          ls -la ~/.local/share/sharetube/cookies.txt

      # ── Tunnel ──────────────────────────────────────────────────────
      # Same SOCKS5 → WebSocket → Oracle exit-IP setup as sharetube.yml.
      # Without it, the macos-26 datacenter IP hits the same YouTube
      # bot wall as the Linux datacenter IP.
      - name: Start OmniProxy tunnel
        env:
          OMNIPROXY_SERVER: ${{ vars.OMNIPROXY_SERVER }}
          PROXY_TOKEN: ${{ secrets.PROXY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${OMNIPROXY_SERVER:-}" ] || [ -z "${PROXY_TOKEN:-}" ]; then
            echo "::warning::OMNIPROXY_SERVER/PROXY_TOKEN not set; running without tunnel"
            exit 0
          fi
          cat > /tmp/omniproxy.yml <<EOF
          addr: 127.0.0.1
          port: 1080
          token: "${PROXY_TOKEN}"
          server: "wss://${OMNIPROXY_SERVER}"
          EOF
          nohup ~/.local/tools/omni-client --config /tmp/omniproxy.yml \
            > /tmp/omniproxy.log 2>&1 &
          for i in $(seq 1 30); do
            if IP=$(curl -s --socks5-hostname 127.0.0.1:1080 https://api.ipify.org 2>/dev/null); then
              echo "tunnel up, exit IP: ${IP}"
              echo "PROXY_URL=socks5://127.0.0.1:1080" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 1
          done
          echo "::error::OmniProxy tunnel failed to come up"
          cat /tmp/omniproxy.log
          exit 1

      # ── Run ────────────────────────────────────────────────────────
      - name: Resolve job id (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch'
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
          INTERNAL_TOKEN: ${{ secrets.INTERNAL_TOKEN }}
          URL: ${{ inputs.url }}
          CONFIG_JSON: ${{ inputs.config_json }}
        run: |
          set -euo pipefail
          # When invoked via repository_dispatch the Worker already
          # created the D1 row; for manual workflow_dispatch tests we
          # POST /api/jobs ourselves so the runner has a real job_id
          # and its progress updates land in the backend instead of
          # being silently dropped as 404s. We also stamp
          # runner=mac into the config so the Worker's dispatch
          # payload carries the right tag — otherwise sharetube.yml
          # sees no runner field, defaults to linux, and races us.
          STAMPED=$(python3 -c "
          import json, sys
          cfg = json.loads('''${CONFIG_JSON}''')
          cfg['runner'] = 'mac'
          print(json.dumps(cfg))
          ")
          RESP=$(curl -sS -X POST "${WORKER_URL}/api/jobs" \
            -H 'Content-Type: application/json' \
            -d "{\"url\":\"${URL}\",\"config\":${STAMPED}}")
          echo "create response: $RESP"
          JOB_ID=$(echo "$RESP" | python3 -c "import json,sys; print(json.load(sys.stdin)['id'])")
          echo "JOB_ID=${JOB_ID}"
          echo "JOB_ID=${JOB_ID}" >> "$GITHUB_ENV"

      - name: Run sharetube runner
        env:
          JOB_ID: ${{ github.event.client_payload.job_id || env.JOB_ID }}
          JOB_URL: ${{ github.event.client_payload.url || inputs.url }}
          JOB_CONFIG_JSON: ${{ github.event.client_payload.config || inputs.config_json }}
          BACKEND_URL: ${{ vars.WORKER_URL }}
          INTERNAL_TOKEN: ${{ secrets.INTERNAL_TOKEN }}
          COOKIES_PASS: ${{ secrets.COOKIES_PASS }}
        run: |
          set -euo pipefail
          echo "JOB_ID=$JOB_ID"
          echo "JOB_URL=$JOB_URL"
          echo "BACKEND_URL=$BACKEND_URL"
          echo "PROXY_URL=${PROXY_URL:-<none>}"
          [ -n "$JOB_ID" ] && [ -n "$JOB_URL" ] || { echo "missing JOB_ID or JOB_URL"; exit 1; }
          python -m runner

      - name: Cleanup (kill tunnel + wipe decrypted cookies)
        if: always()
        run: |
          pkill -f 'omni-client' || true
          rm -f ~/.local/share/sharetube/cookies.txt