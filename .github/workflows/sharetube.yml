name: sharetube

# Triggered by the Cloudflare Worker via
# `POST /repos/{owner}/{repo}/dispatches` (event_type=sharetube-job).
# The Worker emits a tiny payload with just `job_id`; the frontend
# already has the rest of the per-job config.
on:
  repository_dispatch:
    types: [sharetube-job]
  workflow_dispatch:
    inputs:
      job_id:
        description: "Job ID (for manual re-runs of an in-flight job)"
        required: true

# Avoid concurrent runs of the same job_id; keeps idempotent on retry.
concurrency:
  group: sharetube-${{ github.event.client_payload.job_id || inputs.job_id }}
  cancel-in-progress: false

jobs:
  run:
    # Linux worker. Only run on `runner: linux` (default). Mac jobs go
    # to sharetube-mac.yml instead. The Worker dispatch payload always
    # carries a `runner` field; old dispatches without it are skipped
    # (none in practice — Worker has been updated alongside this guard).
    if: github.event.client_payload.runner == 'linux'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # ── Tool versions & cache ────────────────────────────────────────
      # Only yt-dlp is version-checked at run time (it has clean
      # numbered tags and updates often). Everything else — ffmpeg
      # (BtbN rolling build), deno, omni-client, CJK fonts — is
      # effectively frozen and lives under a stable cache key, so
      # cached runs skip the downloads entirely.
      - name: Resolve yt-dlp version
        id: yt
        run: |
          set -euo pipefail
          YT_DLP_VER=$(curl -fsSL https://api.github.com/repos/yt-dlp/yt-dlp/releases/latest \
            | python3 -c "import json,sys;print(json.load(sys.stdin)['tag_name'])")
          echo "v=${YT_DLP_VER}" >> "$GITHUB_OUTPUT"

      # yt-dlp alone — new version = new key, restore falls back to the
      # previous release so we can update the binary in place.
      - name: Cache yt-dlp
        id: ytdlp
        uses: actions/cache@v6
        with:
          path: ~/.local/tools/yt-dlp
          key: ytdlp-${{ runner.os }}-${{ steps.yt.outputs.v }}
          restore-keys: |
            ytdlp-${{ runner.os }}-

      # Everything else (ffmpeg, deno, omni-client, fonts) — frozen;
      # bump the -1 suffix manually when you want to refresh them.
      # NOTE: paths are enumerated (NOT ~/.local/tools) so the frozen
      # cache never contains yt-dlp — that would shadow the separate
      # version-checked yt-dlp cache above.
      - name: Cache frozen tools
        id: fixed
        uses: actions/cache@v6
        with:
          path: |
            ~/.local/tools/ffmpeg
            ~/.local/tools/ffprobe
            ~/.local/tools/omni-client
            ~/.local/tools/deno
            ~/.local/tools/wgcf
            ~/.local/tools/wg
            ~/.local/tools/wg-quick
            ~/.local/share/fonts
          key: tools-fixed-${{ runner.os }}-deno-${{ vars.DENO_VER }}-omni-${{ vars.OMNIPROXY_VER }}-ffmpeg-master-warp-ubuntu-wg-1

      - name: Install yt-dlp
        run: |
          set -euo pipefail
          mkdir -p ~/.local/tools
          # Refresh unless the restored binary already matches the
          # latest release (restore-keys may fall back to an older one).
          CURRENT=$(~/.local/tools/yt-dlp --version 2>/dev/null || true)
          echo "cached yt-dlp: ${CURRENT:-<none>}, latest: ${{ steps.yt.outputs.v }}"
          if [ -x ~/.local/tools/yt-dlp ] && [ "${CURRENT}" = "${{ steps.yt.outputs.v }}" ]; then
            echo "yt-dlp already up to date; skipping download"
            exit 0
          fi
          curl -fsSL --max-time 120 --retry 2 -o ~/.local/tools/yt-dlp \
            "https://github.com/yt-dlp/yt-dlp/releases/download/${{ steps.yt.outputs.v }}/yt-dlp_linux"
          chmod +x ~/.local/tools/yt-dlp
          ~/.local/tools/yt-dlp --version

      - name: Install frozen tools (ffmpeg + deno + omni-client)
        if: steps.fixed.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/.local/tools
          # ffmpeg: BtbN's rolling "latest" build (master branch).
          curl -fsSL --max-time 300 --retry 2 -o /tmp/ffmpeg.tar.xz \
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz"
          tar xJf /tmp/ffmpeg.tar.xz -C /tmp
          mv /tmp/ffmpeg-master-latest-linux64-gpl/bin/ffmpeg ~/.local/tools/ffmpeg
          mv /tmp/ffmpeg-master-latest-linux64-gpl/bin/ffprobe ~/.local/tools/ffprobe
          rm -rf /tmp/ffmpeg-master-latest-linux64-gpl /tmp/ffmpeg.tar.xz
          chmod +x ~/.local/tools/ffmpeg ~/.local/tools/ffprobe
          # OmniProxy client: local SOCKS5 that tunnels over WebSocket to
          # the Oracle server, unlocking the Azure-IP bot wall.
          curl -fsSL --max-time 120 --retry 2 -o /tmp/omni.tar.xz \
            "https://github.com/kurashizu/OmniProxy/releases/download/${{ vars.OMNIPROXY_VER }}/omni-proxy-linux-x86_64.tar.xz"
          tar xJf /tmp/omni.tar.xz -C /tmp
          mv /tmp/dist/client ~/.local/tools/omni-client
          chmod +x ~/.local/tools/omni-client
          rm -f /tmp/omni.tar.xz
          # deno: JS runtime required by yt-dlp to solve YouTube's
          # n/signature challenges.
          curl -fsSL --max-time 120 --retry 2 -o /tmp/deno.zip \
            "https://github.com/denoland/deno/releases/download/${{ vars.DENO_VER }}/deno-x86_64-unknown-linux-gnu.zip"
          unzip -o /tmp/deno.zip -d ~/.local/tools > /dev/null
          chmod +x ~/.local/tools/deno
          rm -f /tmp/deno.zip
          # wgcf: Cloudflare WARP account/profile generator. The account
          # file is decrypted only in the tunnel step below.
          curl -fsSL --max-time 120 --retry 2 -o ~/.local/tools/wgcf \
            "https://github.com/ViRb3/wgcf/releases/download/v2.2.32/wgcf_2.2.32_linux_amd64"
          echo "2ff97f2201972ce582a424455d50a3719a380eef0cd1f3144f7779348e122a2c  $HOME/.local/tools/wgcf" | sha256sum -c -
          chmod +x ~/.local/tools/wgcf
          # WireGuard tools: extract Ubuntu's prebuilt amd64 .deb.
          # This is a direct download only — no apt install and no build.
          WG_DEB_URL="https://archive.ubuntu.com/ubuntu/pool/main/w/wireguard/wireguard-tools_1.0.20210914-1ubuntu4_amd64.deb"
          WG_DEB_SHA256="19790a3203a12791bfaf622ea000780a7558de858766100d52f802079d44c400"
          curl -fsSL --max-time 120 --retry 2 -o /tmp/wireguard-tools.deb "$WG_DEB_URL"
          echo "$WG_DEB_SHA256  /tmp/wireguard-tools.deb" | sha256sum -c -
          rm -rf /tmp/wireguard-tools-root
          python3 - <<'PY'
          import pathlib, subprocess
          p = pathlib.Path('/tmp/wireguard-tools.deb').read_bytes()
          off = 8
          while off < len(p):
              h = p[off:off + 60]
              name = h[:16].decode().strip()
              size = int(h[48:58])
              data = p[off + 60:off + 60 + size]
              if name.startswith('data.tar'):
                  pathlib.Path('/tmp/wireguard-data.tar.zst').write_bytes(data)
                  break
              off += 60 + size + (size % 2)
          else:
              raise SystemExit('data archive missing from deb')
          PY
          unzstd -f /tmp/wireguard-data.tar.zst -o /tmp/wireguard-data.tar >/dev/null
          mkdir -p /tmp/wireguard-tools-root
          tar xf /tmp/wireguard-data.tar -C /tmp/wireguard-tools-root
          install -m 755 /tmp/wireguard-tools-root/usr/bin/wg ~/.local/tools/wg
          install -m 755 /tmp/wireguard-tools-root/usr/bin/wg-quick ~/.local/tools/wg-quick
          rm -rf /tmp/wireguard-tools-root /tmp/wireguard-tools.deb /tmp/wireguard-data.tar.zst /tmp/wireguard-data.tar
          file ~/.local/tools/wg
          ~/.local/tools/ffmpeg -version | head -1
          ~/.local/tools/omni-client --version
          ~/.local/tools/deno --version | head -1

      # CJK fonts for the video watermark (drawtext) — also frozen, so
      # cached as ~/.local/share/fonts; the cache restore puts them
      # back without reinstalling. Transcode finds the .ttc by path, so
      # no fc-cache/fontconfig rebuild is needed on restore.
      - name: Install CJK fonts (cached)
        run: |
          set -euo pipefail
          FONTS_DIR="$HOME/.local/share/fonts"
          mkdir -p "$FONTS_DIR"
          if ls "$FONTS_DIR"/*.ttc > /dev/null 2>&1; then
            echo "fonts restored from cache"
          else
            cd /tmp
            # Grab the Noto CJK .deb directly from Ubuntu's pool
            # (fast on GH's Azure egress) and unpack just the fonts.
            for url in \
              "https://archive.ubuntu.com/ubuntu/pool/main/f/fonts-noto-cjk/fonts-noto-cjk_20230817+repack1-3_all.deb" \
              "https://archive.ubuntu.com/ubuntu/pool/main/f/fonts-noto-cjk/fonts-noto-cjk_20220127+repack1-1_all.deb"
            do
              if curl -fsSL --max-time 90 --retry 2 -o noto-cjk.deb "$url"; then
                break
              fi
            done
            [ -s noto-cjk.deb ] || { echo "::error::could not download fonts-noto-cjk"; exit 1; }
            dpkg-deb -x noto-cjk.deb /tmp/noto-cjk-extract
            find /tmp/noto-cjk-extract/usr/share/fonts -name '*.ttc' -o -name '*.otf' | while read -r f; do
              cp "$f" "$FONTS_DIR/"
            done
            rm -rf /tmp/noto-cjk.deb /tmp/noto-cjk-extract
          fi
          echo "fonts: $(ls "$FONTS_DIR")"

      - name: Add tools to PATH
        run: echo "$HOME/.local/tools" >> "$GITHUB_PATH"

      # ── Cookies decryption ─────────────────────────────────────────
      - name: Decrypt cookies.txt
        env:
          COOKIES_PASS: ${{ secrets.COOKIES_PASS }}
        run: |
          set -euo pipefail
          if [ -z "${COOKIES_PASS:-}" ]; then
            echo "::warning::COOKIES_PASS secret empty; runner will skip --cookies"
            exit 0
          fi
          if [ ! -f secrets/cookies.txt.enc ]; then
            echo "::warning::secrets/cookies.txt.enc missing; runner will skip --cookies"
            exit 0
          fi
          mkdir -p ~/.local/share/sharetube
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in secrets/cookies.txt.enc \
            -out ~/.local/share/sharetube/cookies.txt \
            -pass env:COOKIES_PASS
          # NOTE: never print cookie contents to logs — this chart is on a
          # public repo and the Actions log is visible to anyone.
          ls -la ~/.local/share/sharetube/cookies.txt

      # ── Tunnel ──────────────────────────────────────────────────────
      # The selected mode controls the route before yt-dlp starts:
      # Oracle Australia uses the existing SOCKS5 tunnel; WARP uses the
      # encrypted wgcf account and a full WireGuard tunnel; disabled uses
      # the runner's normal network.
      - name: Start proxy tunnel
        env:
          OMNIPROXY_SERVER: ${{ vars.OMNIPROXY_SERVER }}
          PROXY_TOKEN: ${{ secrets.PROXY_TOKEN }}
          COOKIES_PASS: ${{ secrets.COOKIES_PASS }}
          JOB_CONFIG_JSON: ${{ github.event.client_payload.config || inputs.config_json }}
        run: |
          set -euo pipefail
          PROXY_MODE=$(python3 -c 'import json,os; d=json.loads(os.environ.get("JOB_CONFIG_JSON") or "{}"); m=d.get("proxy_mode"); print(m if m in {"oracle-australia","cloudflare-warp","disabled"} else ("oracle-australia" if d.get("use_proxy", True) else "disabled"))')
          if [ "$PROXY_MODE" = "cloudflare-warp" ]; then
            command -v wg-quick >/dev/null || { echo "::error::wireguard-tools missing"; exit 1; }
            command -v wg >/dev/null || { echo "::error::wg missing"; exit 1; }
            [ -f secrets/wgcf-account.toml.enc ] || { echo "::error::encrypted WARP account missing"; exit 1; }
            mkdir -p "$RUNNER_TEMP/sharetube-warp"
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
              -in secrets/wgcf-account.toml.enc \
              -out "$RUNNER_TEMP/sharetube-warp/wgcf-account.toml" \
              -pass env:COOKIES_PASS
            ~/.local/tools/wgcf generate \
              --config "$RUNNER_TEMP/sharetube-warp/wgcf-account.toml" \
              --profile "$RUNNER_TEMP/sharetube-warp/wgcf.conf"
            sudo env "PATH=$HOME/.local/tools:$PATH" wg-quick up "$RUNNER_TEMP/sharetube-warp/wgcf.conf"
            if WARP_IP=$(curl -fsSL --max-time 20 https://api.ipify.org); then
              echo "Cloudflare WARP tunnel up, exit IP: $WARP_IP"
            else
              echo "::error::Cloudflare WARP tunnel did not provide network access"
              exit 1
            fi
            exit 0
          fi
          if [ "$PROXY_MODE" = "disabled" ]; then
            echo "proxy disabled by job settings"
            exit 0
          fi
          if [ -z "${OMNIPROXY_SERVER:-}" ] || [ -z "${PROXY_TOKEN:-}" ]; then
            echo "::warning::OMNIPROXY_SERVER/PROXY_TOKEN not set; running without tunnel"
            exit 0
          fi
          cat > /tmp/omniproxy.yml <<EOF
          addr: 127.0.0.1
          port: 1080
          token: "${PROXY_TOKEN}"
          server: "wss://${OMNIPROXY_SERVER}"
          EOF
          nohup ~/.local/tools/omni-client --config /tmp/omniproxy.yml \
            > /tmp/omniproxy.log 2>&1 &
          # Wait until the SOCKS5 port actually proxies traffic.
          for i in $(seq 1 30); do
            if IP=$(curl -s --socks5-hostname 127.0.0.1:1080 https://api.ipify.org 2>/dev/null); then
              echo "tunnel up, exit IP: ${IP}"
              echo "PROXY_URL=socks5://127.0.0.1:1080" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 1
          done
          echo "::error::OmniProxy tunnel failed to come up"
          cat /tmp/omniproxy.log
          exit 1

      # ── Run ────────────────────────────────────────────────────────
      - name: Run sharetube runner
        env:
          JOB_ID: ${{ github.event.client_payload.job_id || inputs.job_id }}
          JOB_URL: ${{ github.event.client_payload.url }}
          JOB_CONFIG_JSON: ${{ github.event.client_payload.config }}
          BACKEND_URL: ${{ vars.WORKER_URL }}
          INTERNAL_TOKEN: ${{ secrets.INTERNAL_TOKEN }}
          COOKIES_PASS: ${{ secrets.COOKIES_PASS }}
        run: |
          set -euo pipefail
          echo "JOB_ID=$JOB_ID"
          echo "BACKEND_URL=$BACKEND_URL"
          echo "PROXY_URL=${PROXY_URL:-<none>}"
          python -m runner

      - name: Cleanup (kill tunnel + wipe secrets)
        if: always()
        run: |
          if [ -f "${RUNNER_TEMP:-/tmp}/sharetube-warp/wgcf.conf" ]; then
            sudo env "PATH=$HOME/.local/tools:$PATH" wg-quick down "${RUNNER_TEMP:-/tmp}/sharetube-warp/wgcf.conf" || true
          fi
          pkill -f 'omni-client' || true
          rm -rf "${RUNNER_TEMP:-/tmp}/sharetube-warp"
          rm -f ~/.local/share/sharetube/cookies.txt

      # Upload only the runner's own transcript (a log text we push to
      # the backend already), NOT decrypted cookies or the downloaded
      # Media filenames in /tmp/sharetube-*. Those are private.
      - name: Upload runner transcript on failure
        if: failure()
        shell: bash
        run: |
          : # transcripts are already streamed to the Worker/D1; nothing
            # with secrets should ever be zipped for a public repo.
            # (kept as an explicit no-op so we don't re-add an upload)
        # uses: actions/upload-artifact@v7
        # with:
        #   name: sharetube-logs-${{ github.event.client_payload.job_id || inputs.job_id }}
        #   path: /tmp/sharetube-runner.log  # not currently written
